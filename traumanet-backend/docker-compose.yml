# TraumaNet · infraestructura de las tres bases (Etapa B, D-0003).
# Uso:  copy .env.example .env  (editar secretos)  →  docker compose up -d --wait
# Reinicio desde cero:  docker compose down -v
# Los puertos se publican solo en 127.0.0.1. Sin credenciales en este archivo.

name: traumanet

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16.6}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Los scripts se ejecutan en orden alfabético solo con el volumen vacío.
      - ./database/relational:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  mongo:
    image: mongo:${MONGO_VERSION:-7.0.15}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?defina MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?defina MONGO_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
    mem_limit: 512m

  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.26.0}-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?defina NEO4J_PASSWORD en .env (mínimo 8 caracteres)}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 30s
    mem_limit: 1g

volumes:
  pg_data:
  mongo_data:
  neo4j_data:
